name: Open feature pull request

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request against develop
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '')
            const base = 'develop'
            const { owner, repo } = context.repo

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            })

            if (openPullRequests.length > 0) {
              core.info(`Pull request already exists: #${openPullRequests[0].number}`)
              return
            }

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `Merge ${head} into ${base}`,
              body: `Automatically opened after a push to \`${head}\`.`,
            })

            core.info(`Created pull request #${pullRequest.number}`)
