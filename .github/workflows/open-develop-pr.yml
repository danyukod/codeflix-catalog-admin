name: Open develop pull request

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request against main
        uses: actions/github-script@v7
        with:
          script: |
            const head = 'develop'
            const base = 'main'
            const { owner, repo } = context.repo

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            })

            if (openPullRequests.length > 0) {
              core.info(`Pull request already exists: #${openPullRequests[0].number}`)
              return
            }

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: 'Merge develop into main',
              body: 'Automatically opened after a pull request was merged into `develop`.',
            })

            core.info(`Created pull request #${pullRequest.number}`)
